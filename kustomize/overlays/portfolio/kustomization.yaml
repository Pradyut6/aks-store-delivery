apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: store
resources:
  - ../../base
patches:
  - target:
      kind: Service
      name: store-(front|admin)
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
  - target:
      kind: Deployment
      name: .*
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
  - target:
      kind: Deployment
      name: virtual-(customer|worker)
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: StatefulSet
      name: .*
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
